<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #a855f7; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #a855f7; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.25; 0.45; 0.25" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.2; 0.45; 0.2" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1280" height="400" fill="url(#bg-grad)" />
  <circle cx="220" cy="120" r="280" fill="url(#glow-cyan)" />
  <circle cx="1060" cy="280" r="320" fill="url(#glow-purple)" />

  <!-- 2. Dynamic Matrix / Perspective Grid in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="340" x2="1280" y2="340" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="380" x2="1280" y2="380" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <!-- Radiating perspective lines -->
    <line x1="640" y1="260" x2="0" y2="400" />
    <line x1="640" y1="260" x2="160" y2="400" />
    <line x1="640" y1="260" x2="320" y2="400" />
    <line x1="640" y1="260" x2="480" y2="400" />
    <line x1="640" y1="260" x2="640" y2="400" />
    <line x1="640" y1="260" x2="800" y2="400" />
    <line x1="640" y1="260" x2="960" y2="400" />
    <line x1="640" y1="260" x2="1120" y2="400" />
    <line x1="640" y1="260" x2="1280" y2="400" />
  </g>

  <!-- 3. Animated Neural Synapses & Robotics Circuit Paths (Background Level) -->
  <g opacity="0.35">
    <!-- Animated Dash Line 1 -->
    <path d="M-50,80 Q250,160 500,70 T1050,110 T1330,60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="12s" repeatCount="indefinite" />
    </path>
    <!-- Animated Dash Line 2 -->
    <path d="M-50,320 Q280,220 620,290 T1150,220 T1330,300" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="10 15">
      <animate attributeName="stroke-dashoffset" from="0" to="250" dur="15s" repeatCount="indefinite" />
    </path>
    <!-- Circuit nodes with subtle pulse -->
    <circle cx="280" cy="165" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="70" r="4" fill="#818cf8">
      <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="110" r="5" fill="#c084fc">
      <animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="290" r="4.5" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 4. Decorative Tech Corner Borders -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <path d="M 24,50 L 24,24 L 50,24" fill="none" />
    <path d="M 1256,50 L 1256,24 L 1230,24" fill="none" />
    <path d="M 24,350 L 24,376 L 50,376" fill="none" />
    <path d="M 1256,350 L 1256,376 L 1230,376" fill="none" />
  </g>

  <!-- 5. FOREGROUND (Prominent, High-Contrast, Never Obscured) -->
  <g id="foreground" style="pointer-events: none;">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(640, 68)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="-116" cy="0" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-104" y="5" fill="#94a3b8" font-size="12.5" font-weight="600" letter-spacing="1.5">REINFORCEMENT LEARNING</text>
    </g>

    <!-- Main Title -->
    <text x="640" y="152" text-anchor="middle" font-size="46" font-weight="900" fill="url(#title-grad)" filter="url(#shadow)" letter-spacing="-0.5">
      Awesome RL Platform For Robots
    </text>

    <!-- Subtitle -->
    <text x="640" y="196" text-anchor="middle" font-size="17" font-weight="400" fill="#cbd5e1" filter="url(#shadow)">
      Curated SaaS Platforms, Distributed Frameworks &amp; GPU Simulators for Robot Learning
    </text>

    <!-- Feature Badges / Highlights -->
    <g transform="translate(640, 260)">
      <!-- Pill 1: GPU Simulation -->
      <g transform="translate(-390, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="180" height="42" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
        <text x="90" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="600">⚡ GPU Simulation</text>
      </g>
      <!-- Pill 2: Distributed RL -->
      <g transform="translate(-195, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="180" height="42" rx="8" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4" />
        <text x="90" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="600">🧠 Distributed RL</text>
      </g>
      <!-- Pill 3: Sim-to-Real -->
      <g transform="translate(15, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="180" height="42" rx="8" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4" />
        <text x="90" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="600">🤖 Sim-to-Real Transfer</text>
      </g>
      <!-- Pill 4: PyTorch & JAX -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
        <rect x="0" y="0" width="180" height="42" rx="8" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.4" />
        <text x="90" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13.5" font-weight="600">🔥 PyTorch &amp; JAX</text>
      </g>
    </g>

    <!-- Bottom Metadata Line -->
    <text x="640" y="340" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      MASSIVELY PARALLEL PHYSICS • EXPERIMENT OBSERVABILITY • POLICY LEARNING BENCHMARKS
    </text>
  </g>
</svg>
